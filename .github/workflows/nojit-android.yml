name: No-JIT Android acceptance (Linux)
on:
  push:
    branches: ['feat/nojit']
    paths: ['.github/workflows/nojit-android.yml', 'tests/nojit/host_smoke.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config libglib2.0-dev libpixman-1-dev libffi-dev libslirp-dev libzstd-dev zlib1g-dev libfdt-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build offline APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./tests/nojit/build_fixture_apk.sh
      - name: Compile exact integrated TCI backend
        run: |
          mkdir -p third_party/build build/logs
          curl -fL --retry 3 https://github.com/utmapp/qemu/releases/download/v10.0.12-utm/qemu-10.0.12-utm.tar.xz -o build/qemu.tar.xz
          tar -xf build/qemu.tar.xz -C third_party/build
          ./scripts/integrate_husk.sh
          cd third_party/build/qemu-10.0.12-utm
          mkdir _husk_host_nojit
          cd _husk_host_nojit
          ../configure --target-list=aarch64-softmmu --enable-tcg-interpreter --disable-tcg-threaded-interpreter --disable-shared-lib --extra-cflags=-DHUSK_NO_JIT=1 --enable-slirp --disable-werror --disable-docs --disable-gtk --disable-sdl --disable-opengl --disable-virglrenderer
          ninja -j2 qemu-system-aarch64 qemu-img
          cd "$GITHUB_WORKSPACE"
          python3 scripts/verify_nojit.py --build third_party/build/qemu-10.0.12-utm/_husk_host_nojit
          python3 tests/nojit/test_memory_guard.py
          cc -shared -fPIC tests/nojit/mmap_guard.c -ldl -o build/nojit-mmap-guard.so
      - name: Prepare original Android v12 guest
        run: |
          mkdir -p guests/nojit-host
          curl -fL --retry 3 https://github.com/Leviidev/Husk/releases/download/lineage-v2/vda-v12.qcow2 -o guests/nojit-host/vda.qcow2
          echo 'a8dbaecc8fdcd682991b078d6bbb7df6972e459208634fa8dcbad24f17208d6a  guests/nojit-host/vda.qcow2' | sha256sum -c
          bunzip2 -c third_party/build/qemu-10.0.12-utm/pc-bios/edk2-aarch64-code.fd.bz2 > guests/nojit-host/firmware.fd
          QEMU_IMG=third_party/build/qemu-10.0.12-utm/_husk_host_nojit/qemu-img
          "$QEMU_IMG" create -f qcow2 guests/nojit-host/vars.qcow2 64M
          "$QEMU_IMG" create -f qcow2 guests/nojit-host/userdata.qcow2 16G
      - name: Boot install open touch test with executable-memory guard
        run: |
          python3 tests/nojit/host_smoke.py --qemu third_party/build/qemu-10.0.12-utm/_husk_host_nojit/qemu-system-aarch64 --guest guests/nojit-host --apk build/NoJITSmoke.apk --guard build/nojit-mmap-guard.so --memory 4096 --output build/logs/host-smoke --timeout 7200
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoJIT-Android-runtime-evidence
          path: |
            build/logs/
            build/NoJITSmoke.apk
            third_party/build/qemu-10.0.12-utm/_husk_host_nojit/config-host.h
            third_party/build/qemu-10.0.12-utm/_husk_host_nojit/compile_commands.json
