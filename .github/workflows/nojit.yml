name: Rottweiler No-JIT

on:
  push:
    branches: [main, 'feat/nojit', 'feat/nojit/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: nojit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    if: ${{ !contains(github.event.head_commit.message, '[release-notes]') && !contains(github.event.head_commit.message, '[publish-built]') }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HUSK_NO_JIT: '1'
      DD: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu autoconf automake libtool
          python3 -m venv build/ci-python
          build/ci-python/bin/pip install PyYAML
          echo "$PWD/build/ci-python/bin" >> "$GITHUB_PATH"
      - name: Identify iOS toolchain
        id: toolchain
        run: |
          echo "key=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          python3 scripts/dependency_cache_key.py >> "$GITHUB_OUTPUT"
      - name: Restore iOS dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          key: husk-ios-deps-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ steps.toolchain.outputs.deps }}
          path: |
            build/ios-arm64/sysroot
            build/stamps/libffi-3.5.0
            build/stamps/glib-2.83.0
            build/stamps/pixman-0.38.0
            build/stamps/libucontext
            build/stamps/libslirp-v4.9.1
      - name: Check target isolation
        run: |
          python3 tests/nojit/test_build_contract.py
          python3 tests/nojit/test_guest_performance.py
          python3 tests/nojit/test_bluetooth_block.py
          python3 tests/nojit/test_cached_thaw.py
      - name: Test fragmented guest shell replies
        run: |
          swiftc src/app/Husk/GuestShellFrame.swift tests/nojit/shell_frame_test.swift -o build/shell-frame-tests
          build/shell-frame-tests
          swiftc -D HUSK_NO_JIT src/app/Husk/PendingAPKStage.swift tests/nojit/pending_apk_stage_test.swift -o build/pending-apk-tests
          build/pending-apk-tests
      - name: Build interpreter IPA
        run: ./scripts/ci_build.sh "$PWD/build/Rottweiler.ipa"
      - name: Save completed dependencies
        if: always() && steps.deps.outputs.cache-hit != 'true' && hashFiles('build/stamps/libslirp-v4.9.1') != ''
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.deps.outputs.cache-primary-key }}
          path: |
            build/ios-arm64/sysroot
            build/stamps/libffi-3.5.0
            build/stamps/glib-2.83.0
            build/stamps/pixman-0.38.0
            build/stamps/libucontext
            build/stamps/libslirp-v4.9.1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rottweiler
          path: build/Rottweiler.ipa
          if-no-files-found: error
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rottweiler-build-evidence
          path: |
            build/logs/
            build/DerivedData-nojit/build.log
            third_party/build/qemu-10.0.12-utm/_husk_build_nojit/config-host.h
            third_party/build/qemu-10.0.12-utm/_husk_build_nojit/meson-info/
            third_party/build/qemu-10.0.12-utm/_husk_build_nojit/meson-logs/
            third_party/build/qemu-10.0.12-utm/_husk_build_nojit/compile_commands.json

  fixture-apk:
    if: ${{ !contains(github.event.head_commit.message, '[release-notes]') && !contains(github.event.head_commit.message, '[publish-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check executable-memory guard
        run: python3 tests/nojit/test_memory_guard.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build offline test APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./tests/nojit/build_fixture_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NoJITSmoke-APK
          path: build/NoJITSmoke.apk
          if-no-files-found: error

  release-preview:
    needs: [ios, fixture-apk]
    if: github.event_name == 'push' && github.repository == 'hc6q/Rottweiler' && contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rottweiler
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: NoJITSmoke-APK
          path: release-assets
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config/nojit-version.json"))["version"])')
          tag="v${version}-preview"
          sha256sum release-assets/Rottweiler.ipa release-assets/NoJITSmoke.apk > release-assets/SHA256SUMS.txt
          cp docs/releases/preview.md build-release-notes.md
          printf '\nSource commit: `%s`\n' "$RELEASE_SHA" >> build-release-notes.md
          gh release create "$tag" release-assets/Rottweiler.ipa release-assets/NoJITSmoke.apk release-assets/SHA256SUMS.txt --repo "$RELEASE_REPO" --target "$RELEASE_SHA" --title "Rottweiler ${version} — Experimental preview" --prerelease --notes-file build-release-notes.md

  edit-preview-notes:
    if: github.event_name == 'push' && github.repository == 'hc6q/Rottweiler' && contains(github.event.head_commit.message, '[release-notes]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update existing preview description
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          cp docs/releases/preview.md release-notes.md
          version=$(python3 -c 'import json; print(json.load(open("config/nojit-version.json"))["version"])')
          source=$(python3 -c 'import json; print(json.load(open("config/publish-preview.json"))["source_sha"])')
          printf '\nSource commit: `%s`\n' "$source" >> release-notes.md
          gh release edit "v${version}-preview" --repo "$RELEASE_REPO" --notes-file release-notes.md
