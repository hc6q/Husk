name: Update GitHub Trending widget

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trending-widget
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test widget generator
        run: python3 -m unittest discover -s tests/repository
      - name: Fetch GitHub Trending and regenerate card
        run: python3 scripts/update_trending.py
      - name: Commit changed card
        run: |
          if git diff --quiet -- docs/assets/github-trending.svg; then
            echo 'Trending card already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/github-trending.svg
          git commit -m 'docs: refresh GitHub Trending widget'
          git push
