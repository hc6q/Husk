name: Feature request
description: Suggest an improvement to the experimental No-JIT project.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests within the project's current scope: reproducible No-JIT operation, offline APKs, build tooling, diagnostics and usability.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
      description: Include possible compatibility risks, especially to TCI or the original JIT target.
    validations:
      required: false
